name: Daily Refresh Notion Links

on:
  schedule:
    - cron: "0 17 * * *"   # 17:00 UTC = 凌晨 1:00 北京时间
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NODE_VERSION: '24'    # 修 Node 20 弃用警告,显式锁 Node 24
    steps:
      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_TOKEN }}   # ← 用 Secrets 引用,不是明文

      - name: Empty commit to trigger rebuild
        run: |
          git config user.name "daily-refresh-bot"
          git config user.email "bot@users.noreply.github.com"
          git commit --allow-empty -m "chore: refresh notion links $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

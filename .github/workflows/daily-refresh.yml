name: Daily Refresh Notion Links

on:
  schedule:
    - cron: "30 14 * * *" # Runs at 14:30 UTC = 22:30 北京时间
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_TOKEN }}    # ← 用 Secrets 引用，不是明文

      - name: Empty commit to trigger rebuild
        run: |
          git config user.name "daily-refresh-bot"
          git config user.email "bot@users.noreply.github.com"
          git commit --allow-empty -m "chore: refresh notion links $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
